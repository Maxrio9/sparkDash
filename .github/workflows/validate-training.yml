name: Validate training fork

on:
  push:
    branches: [main, training-module]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    # Match the release image's Debian toolchain. Ubuntu archive DNS can be
    # unavailable on hosted runners; Debian's signed package indexes also keep
    # the zsh fixtures exercised rather than silently skipping them.
    container:
      image: public.ecr.aws/docker/library/node:22-bookworm
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install POSIX test prerequisites
        timeout-minutes: 5
        run: |
          apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o APT::Update::Error-Mode=any update
          apt-get install -y --no-install-recommends python3 zsh git procps util-linux
          python3 --version
          zsh --version
          # Permission and sudo fixtures must run as an ordinary user. Root
          # bypasses chmod-based failures and the launcher intentionally refuses it.
          chown -R node:node "$GITHUB_WORKSPACE"
          runuser -u node -- env PATH="$PATH" node --version
      - run: runuser -u node -- env PATH="$PATH" npm ci
      - run: runuser -u node -- env PATH="$PATH" npm run typecheck
      - run: runuser -u node -- env PATH="$PATH" npm run build
      - run: runuser -u node -- env PATH="$PATH" npm test
