name: Validate training fork

on:
  push:
    branches: [main, training-module]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install POSIX test prerequisites
        timeout-minutes: 3
        run: |
          python3 --version
          if ! command -v zsh >/dev/null; then
            # Avoid the runner's Azure mirrorlist: DNS there can fail while the
            # official HTTPS archive remains available. Scope this to the job.
            echo 'deb https://archive.ubuntu.com/ubuntu noble main' > "$RUNNER_TEMP/sparkdash-apt.list"
            apt_options=(-o "Dir::Etc::sourcelist=$RUNNER_TEMP/sparkdash-apt.list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::https::Timeout=20)
            sudo apt-get "${apt_options[@]}" update
            sudo apt-get "${apt_options[@]}" install -y zsh
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
